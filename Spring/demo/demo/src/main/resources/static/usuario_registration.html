<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários - Sistema de Transporte</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="medlink-theme.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="chatbot.css">
</head>
<body class="has-sidebar">
    <!-- Top Header Bar -->
    <div class="top-header">
        <div class="header-left">
            <button class="sidebar-toggle-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <a href="/home.html" class="home-btn">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
        </div>
        <div class="header-right">
            <div class="user-header-profile">
                <div class="user-avatar-small">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-info-small">
                    <span class="user-name">Administrador</span>
                    <span class="user-email">admin@test.com</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar (injected by JavaScript) -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="main-content">

    

    <div class="container">
        <h1>Cadastro de Usuários 👤</h1>

        <h2><i class="fas fa-user-plus"></i> Adicionar Usuário</h2>
        <form id="formUsuario">
            <label for="nome"><i class="fas fa-user"></i> Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
            
            <label for="email"><i class="fas fa-envelope"></i> Email:</label>
            <input type="email" id="email" name="email" placeholder="usuario@email.com" required>
            
            <label for="senha"><i class="fas fa-lock"></i> Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Senha segura" required>
        
            
            <label for="role"><i class="fas fa-user-tag"></i> Função:</label>
            <select id="role" name="role" required>
                <option value="Agente">👤 Agente</option>
                <option value="Admin">👑 Admin</option>
                <option value="Motorista">🚗 Motorista</option>
            </select>
            
            <button type="submit"><i class="fas fa-save"></i> Cadastrar</button>
        </form>

        <h2><i class="fas fa-list"></i> Lista de Usuários</h2>
        <table id="tabelaUsuarios">
            <thead>
                <tr>
                    <th>ID</th>
                    <th><i class="fas fa-user"></i> Nome</th>
                    <th><i class="fas fa-envelope"></i> Email</th>
                    <th><i class="fas fa-user-tag"></i> Função</th>
                    <th><i class="fas fa-cog"></i> Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="5" style="text-align: center; padding: 20px;">
                        <i class="fas fa-spinner fa-spin"></i> Carregando usuários...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function carregarUsuarios() {
            try {
                const res = await fetch('/usuarios');
                const usuarios = await res.json();
                const tbody = document.querySelector("#tabelaUsuarios tbody");
                tbody.innerHTML = "";
                usuarios.forEach(u => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.id}</td>
                            <td>${u.nome}</td>
                            <td>${u.email}</td>
                            <td>${u.role}</td>
                            <td>
                                <button onclick="editarUsuario(${u.id})">Editar</button>
                                <button onclick="excluirUsuario(${u.id})">Excluir</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Erro ao carregar usuários:', error);
            }
        }

        document.getElementById("formUsuario").addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = new FormData(e.target);
            const data = {};
            form.forEach((value, key) => data[key] = value);
            
            try {
                await fetch('/usuarios', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                e.target.reset();
                carregarUsuarios();
            } catch (error) {
                console.error('Erro ao cadastrar usuário:', error);
            }
        });

        async function excluirUsuario(id) {
            if (confirm('Tem certeza que deseja excluir este usuário?')) {
                try {
                    await fetch('/usuarios/' + id, { method: 'DELETE' });
                    carregarUsuarios();
                } catch (error) {
                    console.error('Erro ao excluir usuário:', error);
                }
            }
        }

        function editarUsuario(id) {
            alert('Funcionalidade de edição a ser implementada');
        }

        carregarUsuarios();
    </script>
    </main>

    <script src="sidebar.js"></script>
    <script>
        // Inject sidebar
        document.getElementById('sidebar-container').innerHTML = createSidebar('usuario_registration');
        
        // Apply saved theme
        const theme = localStorage.getItem('theme') || 'light';
        if (theme === 'dark') {
            document.body.classList.add('dark-theme');
        }
        
        // Apply accessibility settings
        const highContrast = localStorage.getItem('highContrast') === 'true';
        const largeText = localStorage.getItem('largeText') === 'true';
        
        if (highContrast) {
            document.body.classList.add('high-contrast');
        }
        if (largeText) {
            document.body.classList.add('large-text');
        }
    </script>
    <script src="chatbot.js"></script>
</body>
</html>

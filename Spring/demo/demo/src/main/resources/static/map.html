<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa da frota - MedLink</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="medlink-theme.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="chatbot.css">
    <style>
        .pg-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
        .pg-head h1 { margin: 0; }
        .pg-head p { margin: 4px 0 0; color: var(--ml-muted); }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip { border: 1.5px solid var(--ml-line); background: #fff; color: var(--ml-ink); border-radius: 999px; padding: 7px 14px; font-size: .88rem; font-weight: 700; cursor: pointer; }
        .chip:hover { background: #F6FAFE; color: var(--ml-ink); }
        .chip.on { background: var(--ml-navy); border-color: var(--ml-navy); color: #fff; }
        .grid2 { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
        #map { height: calc(100vh - 210px); min-height: 460px; border-radius: var(--ml-radius); border: 1px solid var(--ml-line); box-shadow: var(--ml-shadow); z-index: 0; }
        .lista { display: grid; gap: 10px; max-height: calc(100vh - 210px); min-height: 460px; overflow-y: auto; padding-right: 2px; }
        .item { background: #fff; border: 1px solid var(--ml-line); border-radius: 12px; padding: 12px 14px; cursor: pointer; box-shadow: var(--ml-shadow); }
        .item:hover { border-color: var(--ml-blue); }
        .item .t { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-family: 'Sora', sans-serif; font-size: .95rem; }
        .item .s { color: var(--ml-muted); font-size: .85rem; margin-top: 4px; }
        .pill { font-family: 'Hanken Grotesk', sans-serif; font-size: .72rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
        .pill.rota { background: rgba(63,163,232,.16); color: #1B6FAE; }
        .pill.livre { background: rgba(31,169,113,.15); color: #12744D; }
        .pill.manut { background: rgba(232,163,61,.2); color: #9A6412; }
        .ml-pin { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; font-size: .9rem; border: 3px solid #fff; box-shadow: 0 3px 10px rgba(7,26,48,.35); }
        .ml-pin.rota { background: #3FA3E8; } .ml-pin.livre { background: #1FA971; } .ml-pin.manut { background: #E8A33D; }
        .ml-pin.pac { background: #0A2645; } .ml-pin.feito { background: #1FA971; }
        .leaflet-popup-content { font-family: 'Hanken Grotesk', sans-serif; margin: 12px 14px; }
        .nota { color: var(--ml-muted); font-size: .8rem; margin-top: 10px; }
        select.sel { padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--ml-line); background: #fff; font-family: inherit; font-size: .95rem; min-width: 260px; }
        @media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } #map { height: 420px; min-height: 0; } .lista { max-height: none; min-height: 0; } }

    </style>
</head>
<body class="has-sidebar">
    <div class="top-header">
        <div class="header-left">
            <button class="sidebar-toggle-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <a href="/home.html" class="home-btn"><i class="fas fa-home"></i><span>Home</span></a>
        </div>
        <div class="header-right">
            <div class="user-header-profile">
                <div class="user-avatar-small"><i class="fas fa-user"></i></div>
                <div class="user-info-small">
                    <span class="user-name">Administrador</span>
                    <span class="user-email">admin@test.com</span>
                </div>
            </div>
        </div>
    </div>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="container">
            <div class="pg-head">
                <div>
                    <h1>Mapa da frota</h1>
                    <p>Posição e situação dos veículos · atualiza a cada 10 s</p>
                </div>
                <div class="chips" id="chips"></div>
            </div>
            <div class="grid2">
                <div id="map"></div>
                <div class="lista" id="lista"></div>
            </div>
            <p class="nota">Mapa: OpenStreetMap. Posições dos veículos cadastradas para demonstração.</p>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="sidebar.js"></script>
    <script src="medlink-map.js"></script>
    <script>
        document.getElementById('sidebar-container').innerHTML = createSidebar('map');
        const mapa = criarMapa('map', 13);
        let frota = [], filtro = 'todos', marcadores = {};

        function popup(v) {
            const st = statusDe(v.status);
            return '<b>' + escapar(v.placa) + '</b><br>' + escapar(v.modelo || '') + '<br><span class="pill ' + st.cls + '">' + st.rotulo + '</span><br>' +
                '<i class="fas fa-user-tie"></i> ' + escapar(v.motoristaNome || 'Sem motorista') + (v.motoristaTelefone ? ' · ' + escapar(v.motoristaTelefone) : '') +
                '<br><i class="fas fa-users"></i> ' + (v.capacidade || '-') + ' lugares';
        }
        function desenhar() {
            Object.values(marcadores).forEach(m => m.remove()); marcadores = {};
            const visiveis = frota.filter(v => filtro === 'todos' || statusDe(v.status).cls === filtro);
            visiveis.forEach(v => {
                if (v.latitude == null || v.longitude == null) return;
                marcadores[v.ambulanciaId] = L.marker([v.latitude, v.longitude], { icon: pino(statusDe(v.status).cls, 'fa-van-shuttle') })
                    .addTo(mapa).bindPopup(popup(v));
            });
            document.getElementById('lista').innerHTML = visiveis.map(v => {
                const st = statusDe(v.status);
                return '<div class="item" onclick="foco(' + v.ambulanciaId + ')"><div class="t"><span>' + escapar(v.placa) + '</span><span class="pill ' + st.cls + '">' + st.rotulo + '</span></div>' +
                    '<div class="s">' + escapar(v.modelo || '') + ' · ' + (v.capacidade || '-') + ' lugares</div>' +
                    '<div class="s"><i class="fas fa-user-tie"></i> ' + escapar(v.motoristaNome || 'Sem motorista') + '</div></div>';
            }).join('') || '<div class="item">Nenhum veículo neste filtro.</div>';
            const conta = (c) => frota.filter(v => statusDe(v.status).cls === c).length;
            document.getElementById('chips').innerHTML = [['todos', 'Todos', frota.length], ['rota', 'Em rota', conta('rota')], ['livre', 'Disponíveis', conta('livre')], ['manut', 'Manutenção', conta('manut')]]
                .map(([k, r, n]) => '<button class="chip ' + (filtro === k ? 'on' : '') + '" onclick="filtrar(\'' + k + '\')">' + r + ' · ' + n + '</button>').join('');
        }
        function filtrar(k) { filtro = k; desenhar(); }
        function foco(id) { const m = marcadores[id]; if (m) { mapa.flyTo(m.getLatLng(), 15); m.openPopup(); } }
        let primeira = true;
        async function carregar() {
            try {
                frota = await fetch('/ambulancias/combined').then(r => r.json());
                desenhar();
                if (primeira && frota.length) { primeira = false; mapa.fitBounds(frota.filter(v => v.latitude != null).map(v => [v.latitude, v.longitude]), { padding: [50, 50], maxZoom: 14 }); }
            } catch (e) { console.error('Falha ao carregar a frota', e); }
        }
        carregar(); setInterval(carregar, 10000);
    </script>
    <script src="chatbot.js"></script>
</body>
</html>
